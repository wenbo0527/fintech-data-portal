name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
    # 触发 archive/* tag 推送不跑 CI
    tags-ignore: [ 'archive/*' ]
  pull_request:
    branches: [ main, develop ]

# 同一 PR 取消旧的运行（节省 CI 资源）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: '9.15.4'

jobs:
  # ========== 阶段 1：质量门（快速失败） ==========
  lint:
    name: Lint · ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check (--max-warnings 0)
        run: pnpm run lint:check -- --max-warnings 0

  # ========== 阶段 2：类型检查 ==========
  typecheck:
    name: Typecheck · vue-tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: vue-tsc --noEmit (项目级)
        run: pnpm exec vue-tsc -p tsconfig.typecheck.json --noEmit

  # ========== 阶段 3：单元测试 + 组件测试 ==========
  unit:
    name: Unit + Component Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Vitest run
        run: pnpm run test:unit -- --run
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ========== 阶段 4：E2E 测试（playwright） ==========
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Start subapps dev server
        run: |
          pnpm run dev &
          npx wait-on http://localhost:5177 -t 60000 || true
        env:
          CI: 'true'
      - name: Playwright run
        run: pnpm run test:e2e
        env:
          CI: 'true'
      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ========== 阶段 5：重复代码检测 ==========
  jscpd:
    name: Duplicate Code Check (jscpd)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: jscpd scan (apps + packages)
        run: pnpm exec jscpd apps packages --threshold 5 --reporters json --output jscpd-ci
        continue-on-error: true
      - name: Upload jscpd report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jscpd-report
          path: jscpd-ci/
          retention-days: 7

  # ========== 阶段 6：安全审计（仅 main 触发） ==========
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, unit]
    steps:
      - uses: actions/checkout@v4
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level high
        continue-on-error: true
      - name: depcheck
        run: pnpm exec depcheck
        continue-on-error: true

  base-consistency:
    name: base consistency (vite base ↔ nginx 挂载前缀)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # 纯 grep 校验，无需 pnpm install / node_modules
      # 防止子应用缺 vite base → 产物引根级 /assets/ → 被 portal-shell 吞 → 白屏
      # （2026-10-27 HC 白屏事故沉淀）
      - name: Check each deployed app's vite base matches its nginx path
        run: bash scripts/check-base-consistency.sh
